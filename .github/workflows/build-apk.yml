name: Mahani Builder - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Create Android platform
        run: |
          set -e
          rm -rf /tmp/flutter_template
          flutter create --platforms=android --project-name mahani_app_1791914891607 /tmp/flutter_template
          rm -rf android
          cp -r /tmp/flutter_template/android android
          rm -rf /tmp/flutter_template
          echo "Android platform created"

      - name: Verify environment
        run: |
          set -e
          flutter --version
          dart --version
          java -version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created"
            find build -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK CREATED SUCCESSFULLY"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mahani_app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
